name: Gerar IPA 3105 pt-BR compativel

on: workflow_dispatch

jobs:

  build:
  
    runs-on: macos-15
    
    steps:
    
      - uses: actions/checkout@v4
      
      - name: Descompactar fonte
      
        run: |
        
          unzip -q 3105-ptbr-compat.zip
          
          ls 3105_codigo_publico/
          
      - name: Compilar sem assinatura
      
        run: |
        
          cd 3105_codigo_publico
          
          xcodebuild -project ThreeOneOSFive.xcodeproj -scheme ThreeOneOSFive -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM="" PROVISIONING_PROFILE_SPECIFIER="" IPHONEOS_DEPLOYMENT_TARGET=16.0 ONLY_ACTIVE_ARCH=NO ARCHS="arm64" -derivedDataPath ../DerivedData clean build 2>&1 | tail -80
          
      - name: Montar IPA
      
        run: |
        
          app=$(find DerivedData -path '*/Release-iphoneos/*.app' -type d | head -1)
          
          mkdir -p Payload
          
          cp -R "$app" Payload/
          
          zip -qr 3105-ptbr-compativel.ipa Payload
          
          ls -lh 3105-ptbr-compativel.ipa
          
      - uses: actions/upload-artifact@v4
      
        with:
        
          name: 3105-ptbr-compativel-ipa
          
          path: 3105-ptbr-compativel.ipa





















