name: Gerar IPA 3105 pt-BR compativel

on: workflow_dispatch

jobs:

  build:
  
    runs-on: macos-26
    
    steps:
    
      - uses: actions/checkout@v4
      
      - name: Verificar Xcode e SDK
      
        run: |
        
          xcodebuild -version
          
          xcrun --sdk iphoneos --show-sdk-path
          
          xcrun --sdk iphoneos --show-sdk-version
          
      - name: Descompactar fonte
      
        run: |
        
          unzip -qo 3105-ptbr-compativel-fonte.zip
          
          SOURCE_ROOT=$(find . -type d \( -name '3105-public-build-20260918' -o -name '3105_codigo_publico' \) -print -quit)
          
          test -n "$SOURCE_ROOT"
          
          echo "SOURCE_ROOT=$SOURCE_ROOT" >> "$GITHUB_ENV"
          
          ls -la "$SOURCE_ROOT"
          
      - name: Compilar sem assinatura
      
        run: |
        
          cd "$SOURCE_ROOT"
          
          PROJECT=$(find . -maxdepth 2 -name '*.xcodeproj' -print -quit)
          
          test -n "$PROJECT"
          
          xcodebuild -project "$PROJECT" -target 3105 -configuration Release -sdk iphoneos CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM="" PROVISIONING_PROFILE_SPECIFIER="" IPHONEOS_DEPLOYMENT_TARGET=16.0 ONLY_ACTIVE_ARCH=NO ARCHS="arm64" SYMROOT="$GITHUB_WORKSPACE/build" clean build 2>&1 | tail -80
          
      - name: Montar IPA
      
        run: |
        
          app=$(find . -path '*/Release-iphoneos/*.app' -type d -print -quit)
          
          echo "App encontrado: $app"
          
          test -n "$app"
          
          ls -la "$app/"
          
          mkdir -p Payload
          
          cp -R "$app" Payload/
          
          zip -qr 3105-ptbr-compativel.ipa Payload
          
          ls -lh 3105-ptbr-compativel.ipa
          
      - uses: actions/upload-artifact@v4
      
        with:
        
          name: 3105-ptbr-compativel-ipa
          
          path: 3105-ptbr-compativel.ipa
          




































